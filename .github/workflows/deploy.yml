# ساخت و انتشار روی GitHub Pages
#
# build و deploy عمداً در یک job هستند. وقتی این دو job جدا باشند و
# کسی روی اجرای شکست‌خورده «Re-run failed jobs» بزند، آرتیفکت اجرای
# قبلی داخل همان run باقی می‌ماند و خطای
# «Multiple artifacts named github-pages» می‌دهد.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# فقط آخرین push منتشر شود
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: ساخت خروجی (به‌همراه 404.html و .nojekyll)
        run: npm run build:gh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
